openapi: 3.0.3
info:
  title: TaskFlow API (Go)
  description: >
    Lightweight task/project management API (Trello/Jira-reduced), built in Go
    with chi + PostgreSQL as the Go member of the taskflow portfolio.
  version: "1.0.0"
servers:
  - url: http://localhost:8080
tags:
  - name: auth
  - name: users
  - name: projects
  - name: tasks
paths:
  /api/auth/login:
    post:
      tags: [auth]
      summary: Exchange email + password for a JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/users:
    get:
      tags: [users]
      summary: List users
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
    post:
      tags: [users]
      summary: Register a new user
      description: >
        Not part of the portfolio's original endpoint list, but required to
        create an account to log in with; public on purpose.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '409':
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/users/{id}:
    get:
      tags: [users]
      summary: Get a user by id
      parameters:
        - $ref: '#/components/parameters/IDPathParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/projects:
    get:
      tags: [projects]
      summary: List projects
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
    post:
      tags: [projects]
      summary: Create a project
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/projects/{id}:
    get:
      tags: [projects]
      summary: Get a project by id
      parameters:
        - $ref: '#/components/parameters/IDPathParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags: [projects]
      summary: Update a project
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IDPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Not found
    delete:
      tags: [projects]
      summary: Delete a project
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IDPathParam'
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Not found
  /api/tasks:
    get:
      tags: [tasks]
      summary: List tasks, optionally filtered by project and/or status
      parameters:
        - name: projectId
          in: query
          schema: { type: integer, format: int64 }
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/TaskStatus'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
    post:
      tags: [tasks]
      summary: Create a task
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/tasks/{id}:
    get:
      tags: [tasks]
      summary: Get a task by id
      parameters:
        - $ref: '#/components/parameters/IDPathParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '404':
          description: Not found
    put:
      tags: [tasks]
      summary: Update a task
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IDPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Not found
    delete:
      tags: [tasks]
      summary: Delete a task
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IDPathParam'
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Not found
  /api/tasks/{id}/status:
    patch:
      tags: [tasks]
      summary: Change a task's status
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IDPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  $ref: '#/components/schemas/TaskStatus'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Not found
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IDPathParam:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
  responses:
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      properties:
        error: { type: string }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
    LoginResponse:
      type: object
      properties:
        token: { type: string }
    CreateUserRequest:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string }
        email: { type: string, format: email }
        password: { type: string, format: password, minLength: 8 }
    User:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        email: { type: string, format: email }
        createdAt: { type: string, format: date-time }
    ProjectRequest:
      type: object
      required: [name, ownerId]
      properties:
        name: { type: string }
        description: { type: string }
        ownerId: { type: integer, format: int64 }
    Project:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        description: { type: string }
        ownerId: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
    TaskStatus:
      type: string
      enum: [TODO, IN_PROGRESS, DONE]
    TaskRequest:
      type: object
      required: [title, projectId]
      properties:
        title: { type: string }
        description: { type: string }
        projectId: { type: integer, format: int64 }
        assigneeId: { type: integer, format: int64, nullable: true }
        dueDate: { type: string, format: date, nullable: true }
    Task:
      type: object
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        description: { type: string }
        status:
          $ref: '#/components/schemas/TaskStatus'
        projectId: { type: integer, format: int64 }
        assigneeId: { type: integer, format: int64, nullable: true }
        dueDate: { type: string, format: date, nullable: true }
        createdAt: { type: string, format: date-time }
