name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    name: Build + vet + unit tests + integration tests (Postgres real via Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

      - name: Unit tests (internal/service, fakes en memoria)
        run: go test ./internal/... -v

      - name: Integration tests (Testcontainers levanta Postgres real)
        # El runner de GitHub Actions tiene acceso nativo al docker.sock,
        # asi que Testcontainers puede levantar el contenedor de Postgres
        # sin la complicacion de Docker-in-Docker que hay al correr esto
        # dentro de un contenedor en Windows + Docker Desktop (ver README).
        run: go test ./test/... -v

  docker-build:
    name: Build de la imagen Docker (multi-stage, scratch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker build
        run: docker build -t taskflow-go:ci .
      - name: Tamano de la imagen final
        run: docker images taskflow-go:ci --format "{{.Size}}"

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: go

      - name: Build
        run: go build ./...

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
